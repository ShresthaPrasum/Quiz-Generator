<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quix Setup</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #4a00e0, #8e2de2);
            color: #fff;
        }

        .container{
            position: relative;
            width: 140vh;
            height: 80vh;
            background-color: rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: center;
            border: 1px solid #ffffff7a;
            border-radius: 20px;
            z-index: 1;
            backdrop-filter: blur(10px); 
            padding: 20px;
        }
        .container h1{
            font-size: 4rem;
            font-weight: bold;
            color: rgb(255, 196, 0);
            font-family: "Bubblegum Sans", cursive;
        }


    </style>
</head>
<body>
    <div class="container">
        <h1>Quix Setup</h1>
    </div>
</body>
</html>
