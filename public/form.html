<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quix Setup</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #4a00e0, #8e2de2);
            color: #fff;
        }

        .container{
            width: 70%;
            background-color: rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            border-radius: 20px;
            z-index: 1;
            backdrop-filter: blur(10px); 
            padding: 30px;
        }
        .container h1{
            font-size: 4.5rem;
            font-weight: bold;
            color: rgb(255, 196, 0);
            font-family: "Bubblegum Sans", cursive;
            margin-bottom: 20px;
            text-align: center;
        }
        .container h2{
            font-size: 2.5rem;
            font-weight: bold;
            color: #00e1ff;
            font-family: "Bubblegum Sans", cursive;
            margin-bottom: 10px;
            text-align: center;
        }
        .category, .qn-number, .difficulty, .button-container{
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 10px;
        }
        .category-options{
            gap: 20px;
        }
        .btn{
            padding: 8px 15px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
            background-color: #4a00e0;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            margin-bottom: 10px;
        }
        #start-btn{
            padding: 10px 20px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #fff;
            background-color: #a32bff;
            border: none;
            border-radius: 50px;
            cursor: pointer;
        }

        #custom-q-input{
            padding: 10px 20px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
            background-color: #4a00e0;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            margin-bottom: 10px;
        }
        .active{
            transform: scale(1.1);
            box-shadow: 0 0 10px #00e1ff;
        }
         .activee{
            transform: scale(1.1);
            box-shadow: 0 0 10px #00e1ff;
        }
        .questions{
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            margin-top: 20px;
        }
        .qn{
            border: 1px solid #00e1ff;
            border-radius: 15px;
            margin: 5px;
            aspect-ratio: 1/1;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        #quiz{
            display: none;
            flex-direction: column;
            align-items: center;
        }
        .question-area{
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
            background-color: rgba(0, 0, 0, 0.158);
            border-radius: 15px;
        }
        .question-area p{
            font-weight: bold;
            font-family: "Bubblegum Sans", cursive; 
        }
        .timer{
            font-size: 3rem;
            margin-top: 30px;
            color: rgb(255, 183, 0)
        }
        .ready{
            font-size: 2rem;
            margin-bottom: 20px;

        }
        .question-area .btnn{
            padding: 10px 20px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #fff;
            background-color: #a32bff;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            margin-bottom: 40px;
        }
        /* .hidden{
            display: none !important;
        } */
    </style>
</head>
<body>

        <div class="form" id="container1">
            <form action="/save" method="post" id="form">   
            <h1>Quix Setup</h1>
            <form id="mainform" action="/save">
            <div class="category">

                <div class="category-options">
                    <button type="button" class="btn setup-btn" data-category="mix">Mix</button>

                    <button type="button" class="btn setup-btn" data-category="Astronomy">Astronomy</button>

            <div class="qn-number">

            </div>
            <div class="button-container">

                <button id="start-btn" id="submitbtnnn" type="submit">Start Quix</button>

    <script src="script.js"></script>
    <script>
            

        document.addEventListener('DOMContentLoaded', ()=>{
            
        let Category = null;
        let Difficulty = null;
        let QuestionCount = null;
        let allquestions = [];
        let questionss = [];
        const mainform = document.querySelector('form');

        const categoryButtons = document.querySelectorAll('.category-options .btn');

        const questionInput = document.getElementById('custom-q-input');

        const startButton = document.getElementById('start-btn');

        const form = document.querySelector('.form');

        const quiz = document.querySelector('.quiz');

        const difficultyButtons = document.querySelectorAll('.difficulty-options .btn');
        const ps = document.querySelectorAll('.ps');
        const revealbtn = document.getElementById('reveal');

        categoryButtons.forEach(button => {
            button.addEventListener('click', (e) => {
                e.preventDefault();
                categoryButtons.forEach(btn => btn.classList.remove('active'));

                button.classList.add('active');
                Category = button.dataset.category.toLowerCase();
            });
        });

        difficultyButtons.forEach(button => {
            button.addEventListener('click', (e)=>{
                e.preventDefault();
                difficultyButtons.forEach(btn => 
                    btn.classList.remove('active')
                )
                button.classList.add('active');
                Difficulty= button.dataset.difficulty;
            });
        });

        questionInput.addEventListener('input',()=>{
            QuestionCount= questionInput.value;
        });

        mainform.addEventListener('submit', (e)=>{
            e.preventDefault();
        if(!Category || !Difficulty || !QuestionCount){
            alert("Please select valid category, difficulty and the number of questions!")
            return;
        }            
        console.log(Category);
            console.log(Difficulty);
            console.log(QuestionCount);
            fetch('/save', {
                method: 'POST',
                headers: {'Content-type': 'application/json'},
                body: JSON.stringify({
                    category: Category,
                    diff: Difficulty,
                    limit: QuestionCount
                })
            })
            .then(response=> response.json())
            .then(result=>{
                if(result.success){
                    allquestions = result.questions;
                    console.log(`The random fun num from backend is ${result.random}`);
                    console.log(allquestions);
                    document.getElementById('container1').style.display = "none";
                    document.getElementById('quiz').style.display="block";
                    const qns = document.querySelectorAll('.qn');
            for(let i=0; i<allquestions.length; i++){
                const format = `
                <p class="ps">
                    ${i+1}. ${allquestions[i].question}
                </p>     
                `;
                qns[i].innerHTML = format;
                console.log(qns[i].innerHTML); 

            }
            qns.forEach(qn=>{
                qn.addEventListener('click', (e)=>{
                    e.preventDefault();
                    qns.forEach(q=>{
                        q.classList.remove('activee');
                    })
                    qn.classList.add('activee');
                })
            })

                    const active_question = document.querySelector('.activee');
            revealbtn.addEventListener('click', (e)=>{
                if(!active_question){
                    alert("Please select a question!");
                    return;
                }
                const selected_question = active_question.innerText;
                console.log(selected_question);
            })
                }
            })
    })
        })
