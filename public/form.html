<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quix Setup</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #4a00e0, #8e2de2);
            color: #fff;
        }

        .container{
            width: 70%;
            background-color: rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            border-radius: 20px;
            z-index: 1;
            backdrop-filter: blur(10px); 
            padding: 30px;
        }
        .container h1{
            font-size: 4.5rem;
            font-weight: bold;
            color: rgb(255, 196, 0);
            font-family: "Bubblegum Sans", cursive;
            margin-bottom: 20px;
            text-align: center;
        }
        .container h2{
            font-size: 2.5rem;
            font-weight: bold;
            color: #00e1ff;
            font-family: "Bubblegum Sans", cursive;
            margin-bottom: 10px;
            text-align: center;
        }
        .category, .qn-number, .difficulty, .button-container{
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 10px;
        }
        .category-options{
            gap: 20px;
        }
        .btn{
            padding: 8px 15px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
            background-color: #4a00e0;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            margin-bottom: 10px;
        }
        #start-btn{
            padding: 10px 20px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #fff;
            background-color: #a32bff;
            border: none;
            border-radius: 50px;
            cursor: pointer;
        }

        #custom-q-input{
            padding: 10px 20px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
            background-color: #4a00e0;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            margin-bottom: 10px;
        }
        .active{
            transform: scale(1.1);
            box-shadow: 0 0 10px #00e1ff;
        }
         .activee{
            transform: scale(1.1);
            box-shadow: 0 0 10px #00e1ff;
        }
        .questions{
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            margin-top: 20px;
        }
        .qn{
            border: 1px solid #00e1ff;
            border-radius: 15px;
            margin: 5px;
            aspect-ratio: 1/1;
            display: none;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        #quiz{
            display: none;
            flex-direction: column;
            align-items: center;
        }
        .question-area{
            display: none;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
            background-color: rgba(0, 0, 0, 0.158);
            border-radius: 15px;
        }
        .question-area p{
            font-weight: bold;
            font-family: "Bubblegum Sans", cursive; 
        }
        .ready{
            font-size: 2rem;
            margin: 20px;

        }
        .question-area .btnn{
            padding: 10px 20px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #fff;
            background-color: #a32bff;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            margin-bottom: 40px;
        }
        .selected{
            opacity: 0.4;
            border-color: white;
            background-color: black;
        }
        #reveal-ans{
            display: none;
        }
        .answer-container{
            position: fixed;
            top: 0;
            left: 0;
            background-color: rgba(0, 0, 0, 0.8);
            height: 100%;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            z-index: 100;
        }

        .answer-container h2{
            font-size: 3rem;
            font-weight: bold;
            color: #00e1ff;
            font-family: "Bubblegum Sans", cursive;
            margin-bottom: 20px;
            text-align: center;
        }

        #answer-display{
            font-size  : 2rem;
            color: rgb(255, 242, 0);
            font-weight: 700;
            line-height: 1.5;
            margin-bottom: 20px;
        }
        
        #close-answer{
            padding: 10px 20px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #000;
            background-color: #ff2b2b;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            margin-bottom: 10px;

        }

        .answer-area{
            display: flex;
            flex-direction: column;
            align-items: center;
            background: linear-gradient(135deg, #4a00e0, #8e2de2);
            max-width: 90%;
            width: 600px;
            padding: 20px;
            border-radius: 20px;
            border: 2px solid #ffdd00;
        }
        .back a{
            position: absolute;
            top: 20px;
            left: 20px;
            color: rgb(255, 196, 0);
        }
    </style>
</head>
<body>
    <div class="container" id="container">
        <div class="back">
            <a href="index.html">BACK</a>
        </div>
        <div class="form" id="container1">
            <form action="/save" method="post" id="form">   
            <h1>Quix Setup</h1>
            <form id="mainform" action="/save">
            <div class="category">

                <div class="category-options">
                    <button type="button" class="btn setup-btn" data-category="mix">Mix</button>

            <div class="qn-number">

            </div>
            <div class="button-container">

                <button id="start-btn" id="submitbtnnn" type="submit">Start Quix</button>
            </div>
            </form>
        </div>

            <div class="question-area">
                <p class="ready">
                    <span id="display">Get Ready...</span>

    </div>
    <div class="answer-container">
        <div class="answer-area">
            <h2>The Answer Is...</h2>
            <p id="answer-display">

            </p>
            <button class="btnn" id="close-answer">Close</button>
        </div>

    <script src="script.js"></script>
    <script>
            

        document.addEventListener('DOMContentLoaded', ()=>{
            
        let Category = null;
        let Difficulty = null;
        let QuestionCount = null;
        let allquestions = [];
        let questionss = [];
        let format_store = [];
        let qni = [];
        let qnnum = null;

        const synth = window.speechSynthesis;

        const mainform = document.querySelector('form');

        const categoryButtons = document.querySelectorAll('.category-options .btn');

        const questionInput = document.getElementById('custom-q-input');

        const startButton = document.getElementById('start-btn');

        const form = document.querySelector('.form');

        const quiz = document.querySelector('.quiz');

        const difficultyButtons = document.querySelectorAll('.difficulty-options .btn');
        const ps = document.querySelectorAll('.ps');
        const revealbtn = document.getElementById('reveal');
        const display = document.getElementById('display');

        const questionarea= document.querySelector('.question-area');

        const questionoptions = document.querySelector('.questions');

        const revealanswerbtn = document.getElementById('reveal-ans');

        const answercontainer = document.querySelector('.answer-container');

        const answerdisplay = document.getElementById('answer-display');

        const answerclosebtn = document.getElementById('close-answer');

        const clicksound = new Audio('minecraft_click.mp3');

        const buttons = document.querySelectorAll('.btn, .btnn, .qn, a, #custom-q-input,start-btn');

        buttons.forEach(( button) => {
            button.addEventListener('click', () => {
                clicksound.currentTime = 0;
                clicksound.play();
            });
        });

        categoryButtons.forEach(button => {
            button.addEventListener('click', (e) => {
                e.preventDefault();
                categoryButtons.forEach(btn => btn.classList.remove('active'));

                button.classList.add('active');
                Category = button.dataset.category.toLowerCase();
            });
        });

        difficultyButtons.forEach(button => {
            button.addEventListener('click', (e)=>{
                e.preventDefault();
                difficultyButtons.forEach(btn => 
                    btn.classList.remove('active')
                )
                button.classList.add('active');
                Difficulty= button.dataset.difficulty;
            });
        });

        questionInput.addEventListener('input',()=>{
            QuestionCount= questionInput.value;
        });

        function readaloud(text){
            if(synth.speaking){
                synth.cancel();
            }

            utterance = new SpeechSynthesisUtterance(text);

            utterance.lang = 'en-US';
            utterance.rate = 1.2;

            synth.speak(utterance);
        }

        mainform.addEventListener('submit', (e)=>{
            e.preventDefault();
        if(!Category || !Difficulty || !QuestionCount){
            alert("Please select valid category, difficulty and the number of questions!")
            return;
        }            
        console.log(Category);
            console.log(Difficulty);
            console.log(QuestionCount);
            fetch('/save', {
                method: 'POST',
                headers: {'Content-type': 'application/json'},
                body: JSON.stringify({
                    category: Category,
                    diff: Difficulty,
                    limit: QuestionCount
                })
            })
            .then(response=> response.json())
            .then(result=>{
                if(result.success){
                    allquestions = result.questions;
                    console.log(`The random fun num from backend is ${result.random}`);
                    console.log(allquestions);
                    document.getElementById('container1').style.display = "none";
                    document.getElementById('quiz').style.display="block";
                    const qns = document.querySelectorAll('.qn');
                    
                    qns.forEach((qn,index)=>{
                        qn.setAttribute('data-number', index+1);
                    })
                    console.log(document.querySelector('[data-number="1"]'))
            for(let i=0; i<allquestions.length; i++){
                const format = `
                <p class="ps">
                    ${i+1}. ${allquestions[i].question}
                </p>     
                `;
                format_store[i] = format;
                
                console.log(format_store[i]); 

            }
            const qnnum1 = allquestions.length;
            console.log(qnnum1)
            const displayboxes =  Array.from(qns).slice(0,qnnum1);
            console.log(displayboxes);
            for(i=0;i<allquestions.length;i++){
            displayboxes[i].style.display= 'flex';
            }
                
            qns.forEach(qn=>{
                qn.addEventListener('click', (e)=>{
                    e.preventDefault();
                    if(qn.classList.contains('selected')){
                        return;
                    }
                    qn.style.cursor = "not-allowed";
                    qn.classList.add('selected');
                    qn.classList.add('current-question');
                    questionoptions.style.opacity = 0.5;
                    questionoptions.style.pointerEvents = 'none';
                    qn.classList.remove('activee');
                    qns.forEach(q=>{
                        q.classList.remove('activee');
                    })
                    qn.classList.add('activee');
                    questionarea.style.display = "flex";
                    qnnum = qn.dataset.number;
                })

                qn.addEventListener('mouseenter', (e)=>{
                    e.preventDefault();
                    if(qn.classList.contains('selected')){
                        return;
                    }
                    qn.classList.add('activee');
                })
                qn.addEventListener('mouseleave', (e)=>{
                    e.preventDefault();
                    qn.classList.remove('activee');
                })
            })

            revealbtn.addEventListener('click', (e)=>{
                const active_question = document.querySelector('.current-question');
                if(!active_question){
                    alert("Please select a question!");
                    return;
                }
                const selected_question = active_question.innerText;
                qni = allquestions[qnnum-1];
                display.innerHTML = qni.question;
                readaloud(qni.question);
                revealbtn.style.display = "none";
                revealanswerbtn.style.display = "block";
            })

            revealanswerbtn.addEventListener('click', (e)=>{
                const active_question = document.querySelector('.current-question');
                answercontainer.style.opacity = 1;
                answercontainer.style.visibility = "visible";
                answerdisplay.innerHTML = qni.answer;
                readaloud("The answer is: " + qni.answer);
            })

            answerclosebtn.addEventListener('click', (e)=>{
                const active_question = document.querySelector('.current-question');
                
                answercontainer.style.opacity = 0;
                answercontainer.style.visibility = "hidden";
                revealanswerbtn.style.display = "none";
                revealbtn.style.display = "block";
                active_question.classList.remove('current-question');
                questionoptions.style.opacity = 1;
                questionoptions.style.pointerEvents = 'auto';
                display.innerHTML = "Get Ready...";
                questionarea.style.display = "none";
            })
        }
    })
})
})

        
    </script>
