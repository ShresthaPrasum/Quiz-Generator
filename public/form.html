<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quix Setup</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #4a00e0, #8e2de2);
            color: #fff;
        }

        .container{
            width: 70%;
            background-color: rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            border-radius: 20px;
            z-index: 1;
            backdrop-filter: blur(10px); 
            padding: 30px;
        }
        .container h1{
            font-size: 4.5rem;
            font-weight: bold;
            color: rgb(255, 196, 0);
            font-family: "Bubblegum Sans", cursive;
            margin-bottom: 20px;
            text-align: center;
        }
        .container h2{
            font-size: 2.5rem;
            font-weight: bold;
            color: #00e1ff;
            font-family: "Bubblegum Sans", cursive;
            margin-bottom: 10px;
            text-align: center;
        }
        .category, .qn-number, .difficulty, .button-container{
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 10px;
        }
        .category-options{
            gap: 20px;
        }
        .btn{
            padding: 8px 15px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
            background-color: #4a00e0;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            margin-bottom: 10px;
        }
        #start-btn{
            padding: 10px 20px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #fff;
            background-color: #a32bff;
            border: none;
            border-radius: 50px;
            cursor: pointer;
        }

        #custom-q-input{
            padding: 10px 20px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
            background-color: #4a00e0;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            margin-bottom: 10px;
        }
        .active{
            transform: scale(1.1);
            box-shadow: 0 0 10px #00e1ff;
        }
        .questions{
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            margin-top: 20px;
        }
        .qn{
            border: 1px solid #00e1ff;
            border-radius: 15px;
            margin: 5px;
            aspect-ratio: 1/1;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        .quiz{
            display: none;
            flex-direction: column;
            align-items: center;
        }
        .question-area{
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
            background-color: rgba(0, 0, 0, 0.158);
            border-radius: 15px;
        }
        .question-area p{
            font-weight: bold;
            font-family: "Bubblegum Sans", cursive; 
        }
        .timer{
            font-size: 3rem;
            margin-top: 30px;
            color: rgb(255, 183, 0)
        }
        .ready{
            font-size: 2rem;
            margin-bottom: 20px;

        }
        .question-area .btnn{
            padding: 10px 20px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #fff;
            background-color: #a32bff;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            margin-bottom: 40px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form">    
            <form action="" id="form">   
            <h1>Quix Setup</h1>
            <div class="category">
                <h2>Select a Category</h2>
            
                <div class="category-options">
                    <button class="btn setup-btn" data-category="Mix">Mix</button>
                    <button class="btn setup-btn" data-category="IQ">IQ</button>
                    <button class="btn setup-btn" data-category="Science">Science</button>
                    <button class="btn setup-btn" data-category="Math">Math</button>
                    <button class="btn setup-btn" data-category="Programming">Programming</button>
                    <button class="btn setup-btn" data-category="Sports">Sports</button>
                    <button class="btn setup-btn" data-category="Astronomy">Astronomy</button>
                    <button class="btn setup-btn" data-category="Geography">Geography</button>
                    <button class="btn setup-btn" data-category="History">History</button>
                </div>
            </div>
            <div class="qn-number">
                <h2>Enter the number of Questions</h2>
                <input type="number" id="custom-q-input" placeholder="Custom" min="1" max="139" class="setup-btn">

            </div>

            <div class="difficulty">
                <h2>Choose Difficulty</h2>
                <div class="difficulty-options">
                    <button class="btn setup-btn" data-difficulty="easy">Easy</button>
                    <button class="btn setup-btn" data-difficulty="moderate">Moderate</button>
                    <button class="btn setup-btn" data-difficulty="hard">Hard</button>
                    <button class="btn setup-btn" data-difficulty="extreme">Extreme</button>
                </div>
            </div>
            <div class="button-container">

                <button id="start-btn" id="submit" type="submit">Start Quix</button>
            </div>
        </div>

        <div class="quiz">

            </div>
            <div class="question-area">
                <p class="timer">
                    --
                </p>
                <p class="ready">
                    <span>Get Ready...</span>
                </p>
                <button class="btnn">Reveal Question</button>
            </div>
        </div>
        </form>
    </div>
    <script src="script.js"></script>
    <script>
        let Category = null;
        let Difficulty = null;
        let QuestionCount = null;
        let allquestions = [];

        const categoryButtons = document.querySelectorAll('.category-options .btn');

        const questionInput = document.getElementById('custom-q-input');

        const startButton = document.getElementById('start-btn');

        const form = document.querySelector('.form');

        const quiz = document.querySelector('.quiz');

        const difficultyButtons = document.querySelectorAll('.difficulty-options .btn');

        categoryButtons.forEach(button => {
            button.addEventListener('click', () => {

                categoryButtons.forEach(btn => btn.classList.remove('active'));

                button.classList.add('active');
                Category = button.dataset.category.toLowerCase();
            });
        });

        difficultyButtons.forEach(button => {
            button.addEventListener('click', ()=>{
                difficultyButtons.forEach(btn => 
                    btn.classList.remove('active')
                )
                button.classList.add('active');
                Difficulty= button.dataset.difficulty;
            });
        });

        questionInput.addEventListener('input',()=>{
            QuestionCount= questionInput.value;
        });

        startButton.addEventListener('click', ()=>{
            if(!Category || !Difficulty || !QuestionCount){
                alert("Please select a category, difficulty, and enter the number of questions.");
            }
            else{
                form.remove();
                quiz.style.display = 'block';
            }
        })
        
        const submitbtn = document.querySelector('#submit');
        submitbtn.addEventListener('submit', (e)=>{
            e.preventDefault();
            
            console.log(Category);
            console.log(Difficulty);
            console.log(QuestionCount);
            fetch('/save', {
                method: POST,
                headers: {'Content-type': 'application/json'},
                'body': JSON.stringify({
                    category: Category,
                    diff: Difficulty,
                    limit: QuestionCount
                })
            })
            .then(response=> response.json())
            .then(result=>{
                if(result.success){
                    allquestions = result.questions;
                    console.log(result.random);
                }
            })
        })
    

        
    </script>
</body>
</html>
