<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Your Quix</title>
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Bubblegum+Sans&display=swap");

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        body{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #4a00e0, #8e2de2);
            color: #fff;
        }
        
        .container{
            position: relative;
            width: auto;
            height: 55vh;
            background-color: rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid #ffffff7a;
            border-radius: 20px;
            z-index: 1;
            backdrop-filter: blur(10px);
        }

        .terminal{
            display: flex;
            flex-direction: column;
            width: 55vh;
            height: 35vh;
            background-color: #0d101b;
            border-radius: 10px;
            padding: 20px;
            font-size: 0.9rem;
            margin: 20px;
        }

        .terminal-header{
            display:flex;
            justify-content: flex-start;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 1px solid #ffffff35;
        }
        .code-dot:nth-child(1){
            background-color: #ff5f56;
        }
        .code-dot:nth-child(2){
            background-color: #ffe856;
        }
        .code-dot:nth-child(3){
            background-color: #59ff56;
        }
        .code-dot{
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 5px;
        }
        .terminal-content {
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            line-height: 1.8;
        }
        .code-string a{
            color: #e21e1e;
            font-size: 2.5rem;
            text-align: center;
        }
        .code-string1 a{
            color: #e2df1e;
            font-size: 2.4rem;
            text-align: center;
        }
        .quix button{
            padding: 10px 20px;
            font-size: 1.2rem;
            background-color: purple;
            color: rgb(255, 196, 0);
            border: none;
            border-radius: 15px;
            margin-top: 10px;
        }
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        .back a{
            position: absolute;
            top: 20px;
            left: 20px;
            color: rgb(255, 196, 0);
        }

    </style>
</head>
<body>
    <canvas id="particle-canvas" width="763" height="748"></canvas>
    <div class="back">
            <a href="index.html">BACK</a>
        </div>
    <div class="container">
        
        <div class="terminal">
            <div class="terminal-header">
                <span class="code-dot"></span>
                <span class="code-dot"></span>
                <span class="code-dot"></span>
                <br>
            </div>
            <div class="terminal-content">     
                        <h2 class="code-string">
                            <a href="form.html">QUIX GENERATOR</a>
                        </h2>        
                </div>
        </div>
        <div class="terminal">
            <div class="terminal-header">
                <span class="code-dot"></span>
                <span class="code-dot"></span>
                <span class="code-dot"></span>
                <br>
            </div>
            <div class="terminal-content">
                        <h2 class="code-string1">
                            <a href="competition.html">QUIX COMPETITION</a>
                        </h2>
                </div>
        </div>
        <div class="terminal">
            <div class="terminal-header">
                <span class="code-dot"></span>
                <span class="code-dot"></span>
                <span class="code-dot"></span>
                <br>
            </div>
            <div class="terminal-content">
                        <h2 class="code-string1">
                            <a href="competition.html">GUESS THE FOOTBALLER</a>
                        </h2>
                </div>
        </div>
    </div>
    <script>
        const clicksound = new Audio('minecraft_click.mp3');

        const buttons = document.querySelectorAll('.btn, a');

        buttons.forEach(( button) => {
            button.addEventListener('click', () => {
                clicksound.currentTime = 0;
                clicksound.play();
            });
        });

        const canvas = document.getElementById("particle-canvas");
        const ctx = canvas.getContext("2d");
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        let particles = [];
        function createParticles() {
          particles = [];
          let particleCount = Math.floor(canvas.width / 40);
          for (let i = 0; i < particleCount; i++) {
            particles.push({
              x: Math.random() * canvas.width,
              y: Math.random() * canvas.height,
              vx: (Math.random() - 0.5) * 0.3,
              vy: (Math.random() - 0.5) * 0.3,
              radius: Math.random() * 2 + 1,
            });
          }
        }
        function animateParticles() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = "rgba(255, 255, 255, 0.5)";
          for (let i = 0; i < particles.length; i++) {
            const p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            if (p.x < 0 || p.x > canvas.width) p.vx = -p.vx;
            if (p.y < 0 || p.y > canvas.height) p.vy = -p.vy;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fill();
          }
          requestAnimationFrame(animateParticles);
        }
        window.addEventListener("resize", () => {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
          createParticles();
        });

        createParticles();
        animateParticles();
    </script>
</body>
</html>
