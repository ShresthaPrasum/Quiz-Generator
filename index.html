<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Chewy&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
    <style>
        body{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #4a00e0, #8e2de2);
            color: #fff;
        }

        .container{
            position: relative;
            width: 100vh;
            height: 55vh;
            background-color: rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid #ffffff7a;
            border-radius: 20px;
            z-index: 1;
            backdrop-filter:blur(10px);
        }

        .terminal{
            display: flex;
            flex-direction: column;
            width: 55vh;
            height: 35vh;
            background-color: #0d101b;
            border-radius: 10px;
            padding: 20px;
            font-size: 0.9rem;
        }
        .terminal-header{
            display:flex;
            justify-content: flex-start;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 1px solid #ffffff35;
        }
        .code-dot:nth-child(1){
            background-color: #ff5f56;
        }
        .code-dot:nth-child(2){
            background-color: #ffe856;
        }
        .code-dot:nth-child(3){
            background-color: #59ff56;
        }
        .code-dot{
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 5px;
        }
        .terminal-content {
            color: #fff;
            line-height: 1.8;
        }
        .code-line{
            display: block;
            padding: 0.1rem 0;
        }
        .code-keyword {
            color: #d73a49;
            font-weight: 600;
        }
        .code-string {
            color: #1ee24c;
        }
        .quix{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 40vh;
            flex-direction: column;
            row-gap: 20px;
            margin-left: 20px;
        }
        .quix h1{
            font-size: 5rem;
            color: rgb(255, 196, 0);
            font-family: "Bubblegum Sans", cursive;
            animation: quix 2s infinite;
        }
        .quix p{
            font-size: 1.2rem;
            color: #fff;
        }
        .quix button{
            padding: 10px 20px;
            font-size: 1.2rem;
            background-color: purple;
            color: rgb(255, 196, 0);
            border: none;
            border-radius: 15px;
            margin-top: 10px;
        }
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        @keyframes quix {
            0%{
                transform: scale(1);
            }
            50%{
                transform: scale(1.1);
            }
            100%{
                transform: scale(1);
            }
        }
    </style>
</head>
<body>
    <main>
        <canvas id="particle-canvas" width="763" height="748"></canvas>
        <div class="container">
            <div class="terminal">
                <div class="terminal-header">
                    <span class="code-dot"></span>
                    <span class="code-dot"></span>
                    <span class="code-dot"></span>
                    <br>
                </div>
                <div class="terminal-content">
                    <span class="code-line"><span class="code-keyword">#include</span>
                        <span class="code-string">&lt;stdio.h&gt;</span></span>
                    <span class="code-line"><span class="code-keyword">int</span>
                        <span class="code-keyword">main</span>( ) {</span>
                    <span class="code-line">
                        <span class="code-string">&nbsp;&nbsp;&nbsp;&nbsp;printf("Hello, Player!");</span>
                        <span class="code-line">
                        <span class="code-string">&nbsp;&nbsp;&nbsp;&nbsp;printf("Welcome to QUIX!");</span>
                        <span class="code-line"></span>
                        <span class="code-line">
                            <span class="code-keyword">&nbsp;&nbsp;&nbsp;&nbsp;return</span>
                            <span class="code-number">0</span>;</span>
                        <span class="code-line">}</span>
                    </span></span>
                </div>
            </div>

            <div class="quix">
                <h1>QUIX</h1>
                <p>THE ULTIMATE QUIZ MAKER</p>
                <a href=""><button>Create Quix</button></a>
            </div>
        </div>
    </main>
    <script>
        const canvas = document.getElementById("particle-canvas");
        const ctx = canvas.getContext("2d");
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        let particles = [];
        function createParticles() {
          particles = [];
          let particleCount = Math.floor(canvas.width / 40);
          for (let i = 0; i < particleCount; i++) {
            particles.push({
              x: Math.random() * canvas.width,
              y: Math.random() * canvas.height,
              vx: (Math.random() - 0.5) * 0.3,
              vy: (Math.random() - 0.5) * 0.3,
              radius: Math.random() * 2 + 1,
            });
          }
        }
        function animateParticles() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = "rgba(255, 255, 255, 0.5)";
          for (let i = 0; i < particles.length; i++) {
            const p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            if (p.x < 0 || p.x > canvas.width) p.vx = -p.vx;
            if (p.y < 0 || p.y > canvas.height) p.vy = -p.vy;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fill();
          }
          requestAnimationFrame(animateParticles);
        }
        window.addEventListener("resize", () => {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
          createParticles();
        });

        createParticles();
        animateParticles();
    </script>
</body>
</html>
